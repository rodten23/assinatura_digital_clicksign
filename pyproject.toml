[tool.poetry]
name = "assinatura-digital-clicksign"
version = "0.1.0"
description = ""
authors = ["Rodrigo Alves Tenório <rodten23@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13, <4.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
python-dotenv = "^1.2.1"
fastapi = {extras = ["standard"], version = "^0.121.2"}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.14.5,<0.15.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev ./assinatura_digital_clicksign/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=assinatura_digital_clicksign -vv'
post_test = 'coverage html'